  <body>
    <div id="root">
      <!-- Industry-standard initial preloader (active during initial load and refresh before React hydrates) -->
      <style>
        #fetan-preloader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          z-index: 99999;
          user-select: none;
        }
        .fetan-logo-wrap {
          position: relative;
          width: 88px;
          height: 88px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 20px;
        }
        .fetan-glow {
          position: absolute;
          inset: -12px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(234, 88, 12, 0.45) 0%, rgba(245, 158, 11, 0.15) 55%, transparent 75%);
          filter: blur(14px);
          animation: fetan-glow-pulse 2s ease-in-out infinite;
        }
        .fetan-logo-img {
          position: relative;
          z-index: 2;
          width: 80px;
          height: 80px;
          border-radius: 20px;
          box-shadow: 0 12px 28px rgba(234, 88, 12, 0.35);
          animation: fetan-breathe 2s ease-in-out infinite;
          object-fit: cover;
        }
        .fetan-title {
          font-size: 19px;
          font-weight: 900;
          color: #0f172a;
          letter-spacing: -0.02em;
          margin: 0;
          line-height: 1.2;
        }
        .fetan-title span {
          color: #d97706;
        }
        .fetan-sub {
          font-size: 11px;
          font-weight: 700;
          color: #94a3b8;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          margin-top: 5px;
        }
        .fetan-bar {
          width: 140px;
          height: 3.5px;
          background: #fef3c7;
          border-radius: 99px;
          margin-top: 22px;
          overflow: hidden;
          position: relative;
        }
        .fetan-bar-fill {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, #f59e0b, #ea580c);
          border-radius: 99px;
          animation: fetan-prog 1.2s ease-in-out infinite;
        }
        @keyframes fetan-glow-pulse {
          0%, 100% { opacity: 0.4; transform: scale(0.95); }
          50% { opacity: 0.85; transform: scale(1.1); }
        }
        @keyframes fetan-breathe {
          0%, 100% { transform: scale(1) translateY(0); }
          50% { transform: scale(1.04) translateY(-3px); }
        }
        @keyframes fetan-prog {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(20%); }
          100% { transform: translateX(100%); }
        }
      </style>
      <div id="fetan-preloader">
        <div class="fetan-logo-wrap">
          <div class="fetan-glow"></div>
          <img class="fetan-logo-img" src="/logo.png" alt="Fetan Delivery" />
        </div>
        <h2 class="fetan-title">Fetan <span>Delivery</span></h2>
        <span class="fetan-sub">AASTU Campus Food</span>
        <div class="fetan-bar">
          <div class="fetan-bar-fill"></div>
        </div>
      </div>
